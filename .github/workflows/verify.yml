name: Flask source checks
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: code/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py models
      - name: Check application import and template routes
        run: |
          python - <<'PY'
          from app import app
          app.config.update(TESTING=True)
          with app.test_client() as client:
              for route in ('/login', '/register'):
                  assert client.get(route).status_code == 200, route
          print('Application import and templates passed')
          PY
